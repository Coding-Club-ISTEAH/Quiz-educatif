<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #2f6fed; text-decoration: none; }
  a:hover { color: #1d4fc4; }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif;background:#f5f6f8;min-height:100vh;color:#1a1d24;">

  <header style="display:flex;align-items:center;gap:20px;padding:20px 48px;background:#ffffff;border-bottom:1px solid #ececf0;">
    <a href="#" style="color:#9aa1ad;font-weight:700;font-size:14.5px;flex-shrink:0;">Quitter</a>
    <div style="flex:1;">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#6a707c;margin-bottom:6px;">
        <span>Question {{ current }} / {{ total }}</span>
        <span>{{ modeLabel }}</span>
      </div>
      <div style="height:8px;background:#ececf0;border-radius:999px;overflow:hidden;">
        <div style="height:100%;background:#2f6fed;border-radius:999px;width:{{ progressPct }}%;transition:width 0.3s;"></div>
      </div>
    </div>
    <div style="flex-shrink:0;display:flex;align-items:center;gap:8px;background:{{ timerBg }};color:{{ timerColor }};font-weight:800;font-size:15px;padding:8px 14px;border-radius:999px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ timerColor }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 13v-5"></path></svg>
      {{ timeLabel }}
    </div>
  </header>

  <main style="max-width:680px;margin:0 auto;padding:44px 32px 72px;">

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
      <span style="background:#e9f0fe;color:#2f6fed;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;">🧮 Mathématiques</span>
      <span style="background:#f1f2f5;color:#6a707c;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;">9e année</span>
    </div>

    <div style="background:#fff;border:1px solid #ececf0;border-radius:20px;padding:32px 28px;margin-bottom:24px;">
      <p style="font-size:21px;font-weight:800;line-height:1.4;margin:0;">Quel est le résultat de 7 × 8 ?</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <sc-for list="{{ choices }}" as="choice" hint-placeholder-count="4">
        <button onClick="{{ select(choice.key) }}" style="{{ choice.style }}">
          <span style="{{ choice.letterStyle }}">{{ choice.letter }}</span>
          <span style="flex:1;">{{ choice.text }}</span>
          <sc-if value="{{ choice.showCheck }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a8a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </sc-if>
          <sc-if value="{{ choice.showCross }}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c23a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{ showFeedback }}" hint-placeholder-val="{{ false }}">
      <div style="{{ feedbackBoxStyle }}">
        <div style="font-weight:800;font-size:15px;margin-bottom:6px;">{{ feedbackTitle }}</div>
        <p style="margin:0;font-size:14.5px;line-height:1.55;color:#4a4f5a;">7 × 8 se calcule en additionnant 7 fois 8, ou 8 fois 7 : 8+8+8+8+8+8+8 = 56. C'est une table de multiplication essentielle à mémoriser.</p>
      </div>
    </sc-if>

    <sc-if value="{{ showNextButton }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ next }}" style="width:100%;margin-top:24px;background:#2f6fed;color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;" style-hover="background:#1d4fc4;">Question suivante</button>
    </sc-if>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Rush&quot;,&quot;options&quot;:[&quot;Rush&quot;,&quot;Révision&quot;,&quot;Bombardement&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Comportement&quot;}}">
class Component extends DCLogic {
  state = { selected: null, timeLeft: null };
  correctKey = 'b';
  optionsData = [
    { key: 'a', letter: 'a', text: '54' },
    { key: 'b', letter: 'b', text: '56' },
    { key: 'c', letter: 'c', text: '58' },
    { key: 'd', letter: 'd', text: '64' },
  ];

  componentDidMount() {
    this.resetTimer();
    this.tick = setInterval(() => {
      if (this.state.selected !== null) return;
      this.setState(s => ({ timeLeft: Math.max(0, s.timeLeft - 1) }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); }

  get mode() { return this.props.mode ?? 'Révision'; }
  resetTimer() {
    const start = this.mode === 'Rush' ? 10 : this.mode === 'Bombardement' ? 42 : 20;
    this.setState({ timeLeft: start });
  }

  choiceStyle(key) {
    const { selected } = this.state;
    const isRevision = this.mode === 'Révision';
    const isCorrect = key === this.correctKey;
    let border = '#e3e5ea', bg = '#fff', color = '#1a1d24';
    if (isRevision && selected !== null) {
      if (isCorrect) { border = '#1a8a4a'; bg = '#e9f8ef'; color = '#146436'; }
      else if (key === selected) { border = '#c23a3a'; bg = '#fdecec'; color = '#8f2b2b'; }
    } else if (!isRevision && selected === key) {
      border = '#2f6fed'; bg = '#e9f0fe'; color = '#2f6fed';
    }
    return [
      'width:100%', 'text-align:left', 'display:flex', 'align-items:center', 'gap:14px',
      'border-radius:16px', 'padding:16px 18px', 'font-size:16px', 'font-weight:700',
      'cursor:' + (selected !== null ? 'default' : 'pointer'),
      'border:2px solid ' + border, 'background:' + bg, 'color:' + color,
    ].join(';');
  }

  renderVals() {
    const { selected } = this.state;
    const isRevision = this.mode === 'Révision';
    const showFeedback = isRevision && selected !== null;
    const answered = selected !== null;
    const timerUrgent = this.state.timeLeft !== null && this.state.timeLeft <= 5;

    const choices = this.optionsData.map(o => ({
      key: o.key, letter: o.letter, text: o.text,
      style: this.choiceStyle(o.key),
      letterStyle: 'width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;text-transform:uppercase;',
      showCheck: isRevision && answered && o.key === this.correctKey,
      showCross: isRevision && answered && o.key === selected && o.key !== this.correctKey,
    }));

    return {
      current: 4, total: 10,
      progressPct: 40,
      modeLabel: this.mode,
      timeLabel: this.mode === 'Bombardement'
        ? '0:' + String(this.state.timeLeft ?? 42).padStart(2, '0')
        : (this.state.timeLeft ?? 0) + ' s',
      timerBg: timerUrgent ? '#fdecec' : '#f1f2f5',
      timerColor: timerUrgent ? '#c23a3a' : '#4a4f5a',
      choices,
      showFeedback,
      feedbackTitle: selected === this.correctKey ? '✓ Bonne réponse !' : 'La bonne réponse était 56',
      feedbackBoxStyle: 'margin-top:20px;background:#fff;border:1px solid #ececf0;border-radius:16px;padding:20px 22px;',
      showNextButton: answered && (!isRevision || showFeedback),
      select: (key) => () => { if (this.state.selected === null) this.setState({ selected: key }); },
      next: () => alert('Passage à la question suivante'),
    };
  }
}

</script>
</body>
</html>
