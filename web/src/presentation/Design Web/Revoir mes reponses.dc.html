<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #2f6fed; text-decoration: none; }
  a:hover { color: #1d4fc4; }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif;background:#f5f6f8;min-height:100vh;color:#1a1d24;">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 48px;background:#ffffff;border-bottom:1px solid #ececf0;">
    <a href="#" style="display:flex;align-items:center;gap:8px;color:#4a4f5a;font-weight:700;font-size:15px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a4f5a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Résultats
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:9px;background:#2f6fed;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;">E</div>
      <span style="font-size:18px;font-weight:800;letter-spacing:-0.01em;">EduClé</span>
    </div>
    <div style="width:70px;"></div>
  </header>

  <main style="max-width:700px;margin:0 auto;padding:40px 32px 72px;">

    <h1 style="font-size:24px;font-weight:800;margin:0 0 4px;">Révision de tes réponses</h1>
    <p style="color:#6a707c;font-size:15px;margin:0 0 28px;">{{ score }} / {{ total }} bonnes réponses · Mathématiques</p>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <sc-for list="{{ questions }}" as="q" hint-placeholder-count="6">
        <div style="{{ q.cardStyle }}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
            <span style="color:#9aa1ad;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;">Question {{ q.num }}</span>
            <span style="{{ q.badgeStyle }}">{{ q.badgeText }}</span>
          </div>
          <p style="font-size:16.5px;font-weight:800;margin:0 0 14px;line-height:1.4;">{{ q.text }}</p>

          <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
            <div style="{{ q.givenRowStyle }}">
              <span style="font-weight:700;font-size:13.5px;opacity:0.75;white-space:nowrap;flex-shrink:0;">Ta réponse</span>
              <span style="font-weight:800;font-size:14.5px;text-align:right;">{{ q.givenText }}</span>
            </div>
            <sc-if value="{{ q.showCorrectRow }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e9f8ef;border-radius:10px;padding:10px 14px;color:#146436;">
                <span style="font-weight:700;font-size:13.5px;opacity:0.75;white-space:nowrap;flex-shrink:0;">Bonne réponse</span>
                <span style="font-weight:800;font-size:14.5px;text-align:right;">{{ q.correctText }}</span>
              </div>
            </sc-if>
          </div>

          <div style="background:#f5f6f8;border-radius:12px;padding:14px 16px;">
            <div style="font-weight:800;font-size:13px;color:#4a4f5a;margin-bottom:4px;">Explication</div>
            <p style="margin:0;font-size:14px;line-height:1.55;color:#4a4f5a;">{{ q.explanation }}</p>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;gap:12px;margin-top:28px;">
      <a href="#" style="flex:1;display:flex;align-items:center;justify-content:center;background:#2f6fed;color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:800;">Retour aux résultats</a>
      <a href="#" style="flex:1;display:flex;align-items:center;justify-content:center;background:#fff;color:#4a4f5a;border:1px solid #e3e5ea;border-radius:14px;padding:14px;font-size:15px;font-weight:800;">Retour à l'accueil</a>
    </div>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  raw = [
    { text: 'Quel est le résultat de 7 × 8 ?', given: '56', correct: '56', isCorrect: true,
      explanation: '7 × 8 se calcule en additionnant 7 fois 8 : 8+8+8+8+8+8+8 = 56. C\'est une table de multiplication essentielle à mémoriser.' },
    { text: 'Quelle est la forme irréductible de 12/16 ?', given: '6/8', correct: '3/4', isCorrect: false,
      explanation: 'On divise le numérateur et le dénominateur par leur plus grand diviseur commun, ici 4 : 12÷4=3 et 16÷4=4, donc 3/4.' },
    { text: 'Combien de degrés mesure la somme des angles d\'un triangle ?', given: '180°', correct: '180°', isCorrect: true,
      explanation: 'Dans un triangle, la somme des trois angles intérieurs est toujours égale à 180°, quelle que soit la forme du triangle.' },
    { text: 'Quelle est la valeur de x dans 2x + 4 = 12 ?', given: '3', correct: '4', isCorrect: false,
      explanation: 'On isole x : 2x = 12 − 4 = 8, puis x = 8 ÷ 2 = 4. Il faut toujours faire la même opération des deux côtés de l\'égalité.' },
    { text: 'Quel est le périmètre d\'un carré de côté 5 cm ?', given: '20 cm', correct: '20 cm', isCorrect: true,
      explanation: 'Le périmètre d\'un carré se calcule en multipliant la longueur d\'un côté par 4 : 5 × 4 = 20 cm.' },
  ];

  renderVals() {
    const questions = this.raw.map((q, i) => ({
      num: i + 1,
      text: q.text,
      explanation: q.explanation,
      showCorrectRow: !q.isCorrect,
      correctText: q.correct,
      givenText: q.given,
      cardStyle: 'background:#fff;border:1px solid #ececf0;border-radius:18px;padding:22px;',
      badgeStyle: q.isCorrect
        ? 'background:#e9f8ef;color:#146436;font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:999px;'
        : 'background:#fdecec;color:#8f2b2b;font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:999px;',
      badgeText: q.isCorrect ? 'Correct' : 'Incorrect',
      givenRowStyle: q.isCorrect
        ? 'display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e9f8ef;border-radius:10px;padding:10px 14px;color:#146436;'
        : 'display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fdecec;border-radius:10px;padding:10px 14px;color:#8f2b2b;',
    }));
    const score = this.raw.filter(q => q.isCorrect).length;
    return { questions, score, total: this.raw.length };
  }
}

</script>
</body>
</html>
