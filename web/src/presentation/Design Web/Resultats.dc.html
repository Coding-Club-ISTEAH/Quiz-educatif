<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #2f6fed; text-decoration: none; }
  a:hover { color: #1d4fc4; }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif;background:#f5f6f8;min-height:100vh;color:#1a1d24;">

  <header style="display:flex;align-items:center;justify-content:center;gap:10px;padding:20px 48px;background:#ffffff;border-bottom:1px solid #ececf0;">
    <div style="width:34px;height:34px;border-radius:9px;background:#2f6fed;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;">E</div>
    <span style="font-size:18px;font-weight:800;letter-spacing:-0.01em;">EduClé</span>
  </header>

  <main style="max-width:600px;margin:0 auto;padding:48px 32px 72px;text-align:center;">

    <div style="width:150px;height:150px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;background:{{ ringStyle }};">
      <div style="width:118px;height:118px;border-radius:50%;background:#f5f6f8;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <span style="font-size:30px;font-weight:800;line-height:1;">{{ scoreLabel }}</span>
        <span style="font-size:12.5px;font-weight:700;color:#9aa1ad;margin-top:2px;">{{ scoreSubLabel }}</span>
      </div>
    </div>

    <h1 style="font-size:22px;font-weight:800;margin:0 0 8px;">{{ comment }}</h1>
    <p style="color:#6a707c;font-size:15px;margin:0 0 32px;">Mathématiques · {{ modeLabel }}</p>

    <button onClick="{{ review }}" style="width:100%;background:#2f6fed;color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:12px;" style-hover="background:#1d4fc4;">Revoir mes réponses</button>

    <div style="display:flex;gap:12px;">
      <button onClick="{{ replay }}" style="flex:1;background:#fff;color:#2f6fed;border:2px solid #2f6fed;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;" style-hover="background:#e9f0fe;">Rejouer</button>
      <a href="#" style="flex:1;display:flex;align-items:center;justify-content:center;background:#fff;color:#4a4f5a;border:1px solid #e3e5ea;border-radius:14px;padding:14px;font-size:15px;font-weight:800;">Retour à l'accueil</a>
    </div>

    <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:32px;background:#fff;border:1px solid #ececf0;border-radius:16px;padding:20px 22px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:800;font-size:15px;margin-bottom:4px;">Sauvegarde ton score</div>
          <p style="margin:0;color:#6a707c;font-size:13.5px;">Crée un compte pour garder ton historique et suivre tes progrès.</p>
        </div>
        <a href="#" style="flex-shrink:0;background:#2f6fed;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;">Créer un compte</a>
      </div>
    </sc-if>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;score&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Résultat&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:1,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Résultat&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Bombardement&quot;,&quot;options&quot;:[&quot;Rush&quot;,&quot;Révision&quot;,&quot;Bombardement&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Résultat&quot;},&quot;isGuest&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Résultat&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'Révision';
    const isBombardement = mode === 'Bombardement';
    const score = this.props.score ?? 7;
    const total = this.props.total ?? 10;
    const pct = isBombardement ? 70 : Math.round((score / total) * 100);

    let comment;
    if (pct >= 80) comment = 'Excellent travail !';
    else if (pct >= 50) comment = 'Bien joué, continue comme ça !';
    else comment = 'Bon début — une petite révision t\'aidera à progresser.';

    return {
      ringStyle: 'conic-gradient(#2f6fed ' + pct + '%, #e3e5ea ' + pct + '%)',
      scoreLabel: isBombardement ? total : (score + ' / ' + total),
      scoreSubLabel: isBombardement ? 'questions répondues' : pct + '%',
      comment,
      modeLabel: mode,
      isGuest: this.props.isGuest ?? true,
      review: () => alert('Ouvre la vue de révision : réponses, bonnes réponses et explications'),
      replay: () => alert('Relance la même matière/chapitre/mode'),
    };
  }
}

</script>
</body>
</html>
