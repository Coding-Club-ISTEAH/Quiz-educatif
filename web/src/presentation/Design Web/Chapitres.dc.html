<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #2f6fed; text-decoration: none; }
  a:hover { color: #1d4fc4; }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif;background:#f5f6f8;min-height:100vh;color:#1a1d24;">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 48px;background:#ffffff;border-bottom:1px solid #ececf0;">
    <a href="#" style="display:flex;align-items:center;gap:8px;color:#4a4f5a;font-weight:700;font-size:15px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a4f5a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Accueil
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:9px;background:#2f6fed;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;">E</div>
      <span style="font-size:18px;font-weight:800;letter-spacing:-0.01em;">EduClé</span>
    </div>
    <button style="width:40px;height:40px;border-radius:50%;border:1px solid #e3e5ea;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;" title="Réglages" style-hover="background:#f5f6f8;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b6270" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>

  <main style="max-width:720px;margin:0 auto;padding:40px 32px 72px;">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="width:44px;height:44px;border-radius:12px;background:#2f6fed;display:flex;align-items:center;justify-content:center;font-size:22px;">🧮</span>
        <div>
          <div style="font-size:21px;font-weight:800;">Mathématiques</div>
          <a href="#" style="font-size:13.5px;font-weight:700;">Changer de matière</a>
        </div>
      </div>
    </div>

    <button onClick="{{ selectChapter('Tout') }}" style="width:100%;text-align:left;border:2px solid #2f6fed;background:#e9f0fe;border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:16px;" style-hover="background:#dfe9fd;">
      <div style="display:flex;align-items:center;gap:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        <span style="font-weight:800;font-size:16px;color:#1e2a52;">Tout — tous les chapitres</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

    <div style="color:#9aa1ad;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin:24px 4px 10px;">Chapitres</div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <sc-for list="{{ chapters }}" as="chapter" hint-placeholder-count="8">
        <button onClick="{{ selectChapter(chapter.label) }}" style="width:100%;text-align:left;border:1px solid #ececf0;background:#fff;border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;" style-hover="border-color:#2f6fed;background:#f8faff;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="width:28px;height:28px;border-radius:8px;background:#e9f0fe;color:#2f6fed;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;">{{ chapter.num }}</span>
            <span style="font-weight:700;font-size:15.5px;">{{ chapter.label }}</span>
          </div>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c7cad1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const labels = [
      'Nombres et opérations', 'Fractions et décimaux', 'Algèbre et équations',
      'Géométrie plane', 'Géométrie dans l\'espace', 'Statistiques',
      'Probabilités', 'Trigonométrie'
    ];
    return {
      chapters: labels.map((label, i) => ({ label, num: i + 1 })),
      selectChapter: (chapter) => () => alert('Chapitre « ' + chapter + ' » sélectionné → écran Mode de jeu'),
    };
  }
}

</script>
</body>
</html>
