name: Build APK de test

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Télécharger les dépendances
        working-directory: mobile
        run: flutter pub get

      - name: Vérifier le code
        working-directory: mobile
        run: flutter analyze

      - name: Construire l'APK (mode debug pour test)
        working-directory: mobile
        run: flutter build apk --debug --split-per-abi

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: educle-apk-test-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Résumé du build
        run: |
          echo "## APK construit avec succès ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Les APKs sont disponibles dans l'onglet **Actions > Artifacts**" >> $GITHUB_STEP_SUMMARY
